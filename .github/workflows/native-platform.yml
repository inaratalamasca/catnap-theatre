name: Native companion platform smoke

on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/native-platform-smoke.mjs'
      - '.github/workflows/native-platform.yml'
  push:
    branches: [main, 'feature/**', 'dev/**', 'codex/**']
    paths:
      - 'native/**'
      - 'scripts/native-platform-smoke.mjs'
      - '.github/workflows/native-platform.yml'

permissions:
  contents: read

jobs:
  native-health:
    # Constant GitHub-hosted labels only: never run untrusted PR code on Armin
    # or another self-hosted runner. This job has no secrets or Suno access.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build isolated native launcher and exchange framed health message
        run: node scripts/native-platform-smoke.mjs
