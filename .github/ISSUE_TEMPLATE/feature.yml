name: Feature request
description: Propose a host or listener improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What should the host or listener be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it works?
      description: Describe observable behavior and any native/browser limitations.
    validations:
      required: true
