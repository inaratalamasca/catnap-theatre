<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Catnap synthetic native-audio boundary check</title>
<style>body{font:17px system-ui;color:#ece7f7;background:#171322;padding:32px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style>
<h1>Managed audio boundary</h1><p>This isolated fixture generates two short, quiet synthetic tones. It never contacts Suno or an inbox.</p>
<a aria-label="Playbar: Title for Synthetic first" href="https://suno.com/song/11111111-1111-4111-8111-111111111111">Synthetic first</a>
<audio id="native-audio" preload="auto"></audio><p><button id="run">Run boundary checks</button></p><pre id="result">Ready. This test needs a real browser click.</pre>
<script src="../../extension/managed-native-guard.js"></script>
<script>
// Fixture version 0.6.0: real media events, known synthetic sources, no accounts.
function tone(hz){const samples=48000,bytes=new ArrayBuffer(44+samples*2),view=new DataView(bytes);const text=(at,value)=>{for(let i=0;i<value.length;i++)view.setUint8(at+i,value.charCodeAt(i));};text(0,'RIFF');view.setUint32(4,36+samples*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,48000,true);view.setUint32(28,96000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples*2,true);for(let i=0;i<samples;i++)view.setInt16(44+i*2,Math.sin(i*hz*2*Math.PI/48000)*1200,true);return URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));}
const audio=document.getElementById('native-audio'),first=tone(330),second=tone(880),output=document.getElementById('result');audio.src=first;
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run');button.disabled=true;let firstStarted=false,secondStarts=0,nativeAdvances=0;const gate=CatnapManagedNative;const change=()=>{nativeAdvances++;audio.src=second;audio.play().catch(()=>{});};const playing=()=>{if(audio.currentSrc===first)firstStarted=true;if(audio.currentSrc===second)secondStarts++;};audio.addEventListener('playing',playing);audio.addEventListener('ended',change);try{await gate.command({action:'block',generation:1});await gate.command({action:'play',generation:1,songId:'11111111-1111-4111-8111-111111111111',sourceKey:first});await new Promise(resolve=>setTimeout(resolve,1600));const manualEnd={firstStarted,nativeAdvances,secondStarts,muted:audio.muted,paused:audio.paused,permitted:gate.status().permitted};audio.removeEventListener('ended',change);audio.src=first;await new Promise(resolve=>audio.addEventListener('loadedmetadata',resolve,{once:true}));await gate.command({action:'play',generation:2,songId:'11111111-1111-4111-8111-111111111111',sourceKey:first});audio.src=second;let rejected=false;try{await audio.play();}catch{rejected=true;}await new Promise(resolve=>setTimeout(resolve,300));const sourceChange={playRejected:rejected,secondStarts,muted:audio.muted,paused:audio.paused,permitted:gate.status().permitted};const passed=manualEnd.firstStarted&&manualEnd.nativeAdvances===0&&manualEnd.secondStarts===0&&manualEnd.muted&&manualEnd.paused&&!manualEnd.permitted&&sourceChange.playRejected&&sourceChange.secondStarts===0&&sourceChange.muted&&!sourceChange.permitted;output.textContent=JSON.stringify({passed,manualEnd,sourceChange},null,2);output.dataset.passed=String(passed);}catch(error){output.textContent=JSON.stringify({passed:false,error:error.message});output.dataset.passed='false';}finally{await gate.command({action:'disable',generation:3});audio.removeEventListener('playing',playing);audio.removeEventListener('ended',change);button.disabled=false;}};
</script></html>
